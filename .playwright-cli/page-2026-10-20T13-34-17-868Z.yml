            - generic [ref=e580]:
              - paragraph [ref=e581]: Your calls are not forecasts until the window closes. A call is a record of what you believed on a given day, and it is only scored when the model publishes an observed print 12 months later. Before that it is open, and an open call is not a result.
              - paragraph [ref=e582]: The scoreboard lives only on this device. There is no account, no leaderboard, no comparison with anybody else and nothing uploaded — the records are in this browser's local storage and nowhere else.
              - paragraph [ref=e583]: "The model's own limit applies to any comparison you make here. Its backtest set contains five resolved episodes that all burst and no non-bust rows, so the published number carries no false-positive validation: it has never been shown a bubble that did not break. Measuring yourself against it measures how closely you tracked a model with that record, not which of you was right."
              - paragraph [ref=e584]: The badge rules are printed above each badge, they are computed from your own stored calls, and nothing is awarded for coming back to the page. If you clear your calls, the badges go with them.
