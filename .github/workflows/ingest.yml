name: Daily Ingest + Auto-Discovery

on:
  schedule:
    # Daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      since_days:
        description: 'Lookback window in days for SEC filings'
        required: false
        default: '30'
      feed_days:
        description: 'Lookback window in days for news auto-discovery (1-30)'
        required: false
        default: '2'
      dry_run:
        description: 'Dry run (fetch + log only, do not write data files)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    name: SEC filings + news auto-discovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run SEC EDGAR ingestion crawler
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'AICapitalTracker/1.0 (contact@aicapitaltracker.com)' }}
        run: |
          SINCE_DAYS="${{ inputs.since_days || '30' }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npx tsx scripts/ingest.ts --since "$SINCE_DAYS" --dry-run
          else
            npx tsx scripts/ingest.ts --since "$SINCE_DAYS"
          fi

      - name: Run news auto-discovery scraper
        if: ${{ inputs.dry_run != true }}
        run: |
          FEED_DAYS="${{ inputs.feed_days || '2' }}"
          npx tsx scripts/auto-discover.ts --since "$FEED_DAYS"

      - name: Run test suite against fresh data
        run: npm run test

      - name: Commit updated data files (only if changed)
        run: |
          git config --local user.email "bot@aicapitaltracker.com"
          git config --local user.name "AICapitalTracker Ingestion Bot"
          git add -A data/*.json
          git diff --staged --quiet && echo "No data changes to commit." && exit 0
          git commit -m "chore(data): auto-update discovery filings [skip ci]"
          git pull --rebase
          git push
