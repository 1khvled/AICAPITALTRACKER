name: 24h Automated Market Data Sync

on:
  schedule:
    # Runs every 24 hours at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write

jobs:
  update-market-data:
    name: Fetch Live Feeds, Quantitative Modeling & Rebuild
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run 24h data fetcher & quantitative model engine
        run: npm run update-data

      - name: Generate GitHub Step Summary
        run: |
          node -e '
            const fs = require("fs");
            const model = JSON.parse(fs.readFileSync("src/data/latest-model.json", "utf8"));
            const syncList = JSON.parse(fs.readFileSync("src/data/sync-history.json", "utf8"));
            const sync = syncList[0] || {};
            
            const summary = [
              "# 🚀 24h AI Capital Ingestion & Quantitative Model Execution Summary",
              "",
              `> **Execution Timestamp:** \`${sync.timestamp || new Date().toISOString()}\` | **Status:** \`${sync.status || "SUCCESS"}\` | **Duration:** \`${sync.execution_time_ms || 0}ms\``,
              "",
              "### 📊 Live Model Telemetry & Academic Metrics",
              "| Metric | Current 24h Value | Model Reference / Literature |",
              "|---|---|---|",
              `| **Burst Probability** | **${model.burstProbability}%** | 12-month horizon logistic probability |`,
              `| **Composite Stress Score** | **${model.compositeScore} / 100** | Multi-factor weighted stress |`,
              `| **Risk Band** | \`${model.band ? model.band.toUpperCase() : "N/A"}\` | Current fragility classification |`,
              `| **Merton Distance-to-Default** | **${model.merton?.distanceToDefault ?? "N/A"}σ** | Merton (1974) Structural Option Model |`,
              `| **Merton Default Probability** | **${model.merton?.defaultProbabilityPct ?? "N/A"}%** | 1-year structural default odds |`,
              `| **Altman Z\'\'-Score** | **${model.altman?.score ?? "N/A"}** | Altman (2002) Non-Manufacturer Distress (${model.altman?.zone ?? "N/A"}) |`,
              `| **Sornette LPPLS Bubble Hazard** | **${model.lppls?.crashHazardRatePct ?? "N/A"}%** | Singularity Window: ${model.lppls?.estimatedCriticalWindow ?? "N/A"} |`,
              `| **Monte Carlo 10k Median** | **${model.monteCarlo?.medianProbabilityPct ?? "N/A"}%** | 90% CI: [${model.monteCarlo?.ci90Pct?.join(", ") ?? "N/A"}]% |`,
              `| **Monte Carlo 95% VaR / CVaR** | **${model.monteCarlo?.valueAtRisk95Pct ?? "N/A"}% / ${model.monteCarlo?.conditionalValueAtRisk95Pct ?? "N/A"}%** | Tail Risk & Expected Shortfall |`,
              "",
              "### 🌐 Primary Market Feed Verification",
              "| Ingestion Feed | Telemetry Reading |",
              "|---|---|",
              `| **OpenRouter Models API** | Token Deflation Multiple: \`${sync.token_decline_multiple || "N/A"}\` |`,
              `| **Polymarket Gamma API** | 2026 Bubble Downturn Odds: \`${((sync.polymarket_yes_prob || 0) * 100).toFixed(1)}%\` |`,
              `| **Primary Deal Ledger** | Disclosed AI Volume: \`$${((sync.disclosed_volume_usd || 0) / 1e12).toFixed(2)}T\` (${sync.deals_count || 0} deals) |`,
              `| **Debt Reliance Share** | \`${sync.debt_share_pct || "N/A"}\` of disclosed capital structure |`,
              "",
              "---",
              "*Automated 24h cron execution running daily at 00:00 UTC via GitHub Actions.*"
            ].join("\n");
            
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          '

      - name: Run Quantitative Algorithm Test Suite (10/10 math tests)
        run: npm run test:algo

      - name: Verify Next.js build with fresh data
        run: npm run build

      - name: Commit and push updated market data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/data/live-inputs.json src/data/latest-model.json src/data/trajectory-history.json src/data/live-stocks.json src/data/sync-history.json src/data/deals.json
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No data changes detected in this 24h cycle."
          else
            echo "Data changes detected. Committing and pushing..."
            git commit -m "chore(data): automated 24h market feeds & quantitative models update [skip ci]"
            git push
          fi
